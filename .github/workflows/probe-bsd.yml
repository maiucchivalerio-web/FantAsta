name: Prova BSD

# Avvio solo manuale: verifica cosa dà BSD (Bzzoiro) per la Serie A (indisponibili, rigori)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova accesso Serie A
        env:
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: python scripts/probe_bsd.py
