name: Prova Highlightly

# Avvio solo manuale: verifica cosa include il piano gratuito per la Serie A (poche richieste)
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Anno di inizio stagione (2026 = 2026/27)"
        default: "2026"
      match_date:
        description: "Giorno con partite già giocate (AAAA-MM-GG), facoltativo"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prova accesso Serie A
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          SEASON: ${{ github.event.inputs.season }}
          MATCH_DATE: ${{ github.event.inputs.match_date }}
        run: python scripts/probe_highlightly.py
